name: Test

on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Tools
        run: |
          sudo apt-get -o Acquire::Retries=5 update -qq
          sudo apt-get -o Acquire::Retries=5 install -y -qq meson ninja-build xfsprogs mergerfs attr acl >/dev/null
          uname -r
          grep -o 'CONFIG_FUSE_PASSTHROUGH=.' /boot/config-$(uname -r) || true

      - name: unwake.plg is well-formed XML (a bare & in a script breaks the install)
        run: python3 -c "import xml.dom.minidom; xml.dom.minidom.parse('unwake.plg')"

      - name: Compile unwaked
        run: make build-daemon

      - name: Integration test (loop XFS disks, mergerfs as shfs)
        run: sudo timeout 600 bash tests/integration.sh usr/local/sbin/unwaked

      - name: Daemon log
        if: always()
        run: sudo cat /tmp/unwake-test.log 2>/dev/null | tail -200 || true
